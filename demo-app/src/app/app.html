<div class="app-container">
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-content">
      <h1 class="logo">Stock Screener</h1>
      
      <div class="nav-links">
        <a routerLink="/screener" class="nav-link" *ngIf="isAuthenticated">Screener</a>
        <a routerLink="/profile" class="nav-link" *ngIf="isAuthenticated">Profile</a>
      </div>

      <div class="nav-actions">
        <span class="auth-status" *ngIf="isAuthenticated">
          ✓ Logged In
        </span>
        <button class="logout-btn" *ngIf="isAuthenticated" (click)="handleLogout()">
          Logout
        </button>
        <a *ngIf="!isAuthenticated" routerLink="/auth/login" class="login-link">
          Login
        </a>
        <a *ngIf="!isAuthenticated" routerLink="/auth/register" class="register-link">
          Register
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2024 Stock Screener. Basic stock analysis tools without technical indicators or watchlists.</p>
  </footer>
</div>
