<div class="app-container" [class.fullscreen]="fullscreen()">
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-content">
      <h1 class="logo" routerLink="/home">Stock Screener</h1>

      <div class="nav-links">
        <a routerLink="/home" routerLinkActive="active" class="nav-link">Home</a>
        <a routerLink="/screener" routerLinkActive="active" class="nav-link">Screener</a>
        <a [routerLink]="['/charts', chartsSymbol()]" routerLinkActive="active" class="nav-link">Charts</a>
        <a routerLink="/pricing" routerLinkActive="active" class="nav-link">Pricing</a>
      </div>

      <div class="nav-actions">
        <button
          type="button"
          class="theme-toggle"
          (click)="theme.cycle()"
          [attr.aria-label]="'Theme: ' + theme.mode() + ' (click to change)'"
          [title]="'Theme: ' + theme.mode()"
        ><app-icon [name]="themeIcon[theme.mode()]" [size]="18" /></button>
        <a
          *ngIf="isAuthenticated"
          routerLink="/profile"
          class="account-link"
          [title]="userEmail"
          [attr.aria-label]="'My Account: ' + userEmail"
        >
          My Account
        </a>
        <button class="logout-btn" *ngIf="isAuthenticated" (click)="handleLogout()">
          Logout
        </button>
        <a *ngIf="!isAuthenticated" routerLink="/auth/login" class="login-link">
          Login
        </a>
        <a *ngIf="!isAuthenticated" routerLink="/auth/register" class="register-link">
          Register
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="footer" *ngIf="!fullscreen()">
    <p>&copy; 2024 Stock Screener. Basic stock analysis tools without technical indicators or watchlists.</p>
  </footer>
  <app-api-toast />
</div>
