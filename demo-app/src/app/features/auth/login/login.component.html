<div class="login-container">
  <div class="login-card">
    <h2>Login</h2>
    <p class="subtitle">Professional Stock Analysis Platform</p>

    <form (ngSubmit)="handleLogin()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter username" />
        <small>Enter your credentials</small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter password" />
        <small>Check your email for password reset</small>
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div class="info-box" *ngIf="!isAuthenticated">
      <h4>Getting Started</h4>
      <p>Sign in with your registered account</p>
    </div>

    <div class="success-box" *ngIf="isAuthenticated">
      <h4>✓ Login Successful!</h4>
      <p>JWT Token has been stored</p>
      <button type="button" (click)="goToDashboard()">
        Go to Dashboard
      </button>
      <button type="button" (click)="handleLogout()" class="logout">
        Logout
      </button>
    </div>

    <div class="error-box" *ngIf="error">
      <p>{{ error }}</p>
    </div>

    <div class="register-link">
      Don't have an account? <a routerLink="/auth/register">Register here</a>
    </div>
  </div>
</div>
