<div class="register-container">
  <div class="register-card">
    <h2>Create Account</h2>
    <p class="subtitle">Join our stock screener platform</p>

    <form (ngSubmit)="handleRegister()">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          [(ngModel)]="name"
          name="name"
          placeholder="Your full name"
          required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
          required />
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          placeholder="Choose a username"
          required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Min 6 characters"
          required />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm password"
          required />
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating Account...' : 'Create Account' }}
      </button>
    </form>

    <div class="error-box" *ngIf="error">
      <p>{{ error }}</p>
    </div>

    <div class="success-box" *ngIf="isRegistered">
      <h4>✓ Registration Successful!</h4>
      <p>Your account has been created. Redirecting...</p>
    </div>

    <div class="login-link">
      Already have an account? <a routerLink="/auth/login">Login here</a>
    </div>
  </div>
</div>
