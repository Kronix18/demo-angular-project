<div class="verify-container">
  <div class="verify-card">
    
    <!-- Verifying State -->
    <div *ngIf="isVerifying" class="verifying-state">
      <div class="spinner">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
        </svg>
      </div>
      <h1>Verifying Your Email</h1>
      <p class="subtitle">Please wait while we confirm your email address...</p>
    </div>

    <!-- Success State -->
    <div *ngIf="isSuccess" class="success-state">
      <div class="success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      
      <h1>Email Verified Successfully!</h1>
      
      <div class="message-box success">
        <p class="main-message">Your email address has been verified.</p>
        <p class="redirect-message">Redirecting to login in <strong>{{ countdown }}</strong> seconds...</p>
      </div>

      <div class="actions">
        <button (click)="goToLogin()" class="primary-button">
          Go to Login Now
        </button>
      </div>
    </div>

    <!-- Error State -->
    <div *ngIf="isError" class="error-state">
      <div class="error-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </div>
      
      <h1>Verification Failed</h1>
      
      <div class="message-box error">
        <p class="error-message">{{ errorMessage }}</p>
      </div>

      <div class="actions">
        <button (click)="goToLogin()" class="primary-button">
          Go to Login
        </button>
        <button (click)="resendVerification()" class="secondary-button">
          Resend Verification Email
        </button>
      </div>
    </div>

  </div>
</div>
